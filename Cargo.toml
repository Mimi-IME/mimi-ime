[package]
name = "mimi-ime"
version = "1.1.0"
edition = "2024"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[dependencies]
tokio = { version = "1.52.3", features = ["rt", "macros", "signal"] }
ksni = "0.3.4"
users = "0.11.0"
vi = "0.8.0"
wayland-client = "0.31.14"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.9.0"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
polling = { version = "3.11.0", features = ["tracing"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }
